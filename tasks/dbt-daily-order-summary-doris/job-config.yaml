# Reusable smoke config for this resource-heavy Doris tracer.
# Usage: uvx harbor run -c tasks/dbt-daily-order-summary-doris/job-config.yaml \
#          -p tasks/dbt-daily-order-summary-doris

jobs_dir: jobs
n_attempts: 1
timeout_multiplier: 1.0

orchestrator:
  type: local
  n_concurrent_trials: 1
  quiet: false

environment:
  type: docker
  force_build: true
  delete: true

agents:
  - name: oracle
